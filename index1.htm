        <script>
            const wrapper = document.querySelector('#lista_processos');
            const content = wrapper.querySelector('#processes');
            const thumb = wrapper.querySelector('.scroll-thumb');
            const track = wrapper.querySelector('.scroll-track');

            // tamanho fixo do thumb
            const thumbHeight = 46;
            thumb.style.height = `${thumbHeight}px`;
            track.style.width = `30px`;
            function updateThumb() {
            const contentHeight = content.scrollHeight;
            const wrapperHeight = wrapper.clientHeight;
            

            // mostra ou esconde o thumb conforme necessário
            if (contentHeight <= wrapperHeight) {
                thumb.style.display = 'none';
                return;
            } else {
                thumb.style.display = 'block';
            }

            const maxThumbTop = wrapperHeight - thumbHeight;
            const maxScroll = contentHeight - wrapperHeight;
            const ratio = content.scrollTop / maxScroll;

            thumb.style.top = `${ratio * maxThumbTop}px`;
            }

            // sincroniza o thumb
            content.addEventListener('scroll', updateThumb);
            window.addEventListener('resize', updateThumb);
            updateThumb();

            // --- lógica de arraste ---
            let dragging = false;
            let startY = 0;
            let startThumbTop = 0;

            thumb.addEventListener('mousedown', e => {
            dragging = true;
            startY = e.clientY;
            startThumbTop = parseFloat(thumb.style.top) || 0;
            document.body.style.userSelect = 'none'; // evita seleção de texto
            e.preventDefault();
            });

            document.addEventListener('mouseup', () => {
            dragging = false;
            document.body.style.userSelect = '';
            });

            document.addEventListener('mousemove', e => {
            if (!dragging) return;

            const wrapperHeight = wrapper.clientHeight;
            const contentHeight = content.scrollHeight;
            const maxThumbTop = wrapperHeight - thumbHeight;
            const maxScroll = contentHeight - wrapperHeight;

            let newTop = startThumbTop + (e.clientY - startY);
            newTop = Math.max(0, Math.min(newTop, maxThumbTop));
            thumb.style.top = `${newTop}px`;

            const ratio = newTop / maxThumbTop;
            content.scrollTop = ratio * maxScroll;
            });
        </script>
        <script>
            function atualizarData() {
                const now = new Date();
    
                const weekdays = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
                const weekday = weekdays[now.getDay()];

                const hours = String(now.getHours()).padStart(2, "0");
                const minutes = String(now.getMinutes()).padStart(2, "0");
                const time = `${hours}:${minutes}`;

                const year = now.getFullYear();

                const formatted = `${weekday} ${time} ${year}`;

                document.getElementById("date").textContent = formatted;
                }

                setInterval(atualizarData, 60000);
                atualizarData();
        </script>
        <script>
const procsDiv = document.getElementById("procs");
const tabPagsDiv = document.getElementById("tab_pags");

// Cria apenas a estrutura da tabela, com valores vazios
function criarTabelaDoProcesso(proc) {
    const table = document.createElement("table");

    // Cabeçalho
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");
    ["pageId", "frame", "valid"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    // Corpo (somente pageId, frame e valid vazios)
    const tbody = document.createElement("tbody");

    // Usa o array proc.tabelaVazia que você criou no pré-tratamento
    (proc.tabelaPaginas || []).forEach(pagina => {
        const tr = document.createElement("tr");

        const tdPageId = document.createElement("td");
        tdPageId.textContent = pagina.pageId;
        tr.appendChild(tdPageId);

        const tdFrame = document.createElement("td");
        tdFrame.textContent = "-";     // SEM preenchimento
        tr.appendChild(tdFrame);

        const tdValid = document.createElement("td");
        tdValid.textContent = "-";     // SEM preenchimento
        tr.appendChild(tdValid);

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    return table;
}

// Mostra a tabela base do processo
function mostrarTabela(procId) {
    const procs = window.processosSim;
    if (!procs) return;

    const proc = procs.find(p => String(p.id) === String(procId));
    if (!proc) return;

    tabPagsDiv.innerHTML = "";
    tabPagsDiv.appendChild(criarTabelaDoProcesso(proc));
}

// Liga o clique nos blocos de processos
function attachProcClicks() {
    procsDiv.querySelectorAll(".proc").forEach(procEl => {
        procEl.addEventListener("click", () => mostrarTabela(procEl.dataset.id));
    });
}

// Tenta conectar imediatamente
attachProcClicks();

// Mostra automaticamente o primeiro processo (vazio)
const tryMostrarPrimeiro = () => {
    const procs = window.processosSim;
    if (procs && procs.length) {
        mostrarTabela(procs[0].id);
    } else {
        setTimeout(tryMostrarPrimeiro, 100);
    }
};
tryMostrarPrimeiro();
