        <script>
            const wrapper = document.querySelector('#lista_processos');
            const content = wrapper.querySelector('#processes');
            const thumb = wrapper.querySelector('.scroll-thumb');
            const track = wrapper.querySelector('.scroll-track');

            // tamanho fixo do thumb
            const thumbHeight = 46;
            thumb.style.height = `${thumbHeight}px`;
            track.style.width = `30px`;
            function updateThumb() {
            const contentHeight = content.scrollHeight;
            const wrapperHeight = wrapper.clientHeight;
            

            // mostra ou esconde o thumb conforme necessário
            if (contentHeight <= wrapperHeight) {
                thumb.style.display = 'none';
                return;
            } else {
                thumb.style.display = 'block';
            }

            const maxThumbTop = wrapperHeight - thumbHeight;
            const maxScroll = contentHeight - wrapperHeight;
            const ratio = content.scrollTop / maxScroll;

            thumb.style.top = `${ratio * maxThumbTop}px`;
            }

            // sincroniza o thumb
            content.addEventListener('scroll', updateThumb);
            window.addEventListener('resize', updateThumb);
            updateThumb();

            // --- lógica de arraste ---
            let dragging = false;
            let startY = 0;
            let startThumbTop = 0;

            thumb.addEventListener('mousedown', e => {
            dragging = true;
            startY = e.clientY;
            startThumbTop = parseFloat(thumb.style.top) || 0;
            document.body.style.userSelect = 'none'; // evita seleção de texto
            e.preventDefault();
            });

            document.addEventListener('mouseup', () => {
            dragging = false;
            document.body.style.userSelect = '';
            });

            document.addEventListener('mousemove', e => {
            if (!dragging) return;

            const wrapperHeight = wrapper.clientHeight;
            const contentHeight = content.scrollHeight;
            const maxThumbTop = wrapperHeight - thumbHeight;
            const maxScroll = contentHeight - wrapperHeight;

            let newTop = startThumbTop + (e.clientY - startY);
            newTop = Math.max(0, Math.min(newTop, maxThumbTop));
            thumb.style.top = `${newTop}px`;

            const ratio = newTop / maxThumbTop;
            content.scrollTop = ratio * maxScroll;
            });
        </script>
        <script>
            function atualizarData() {
                const now = new Date();
    
                const weekdays = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
                const weekday = weekdays[now.getDay()];

                const hours = String(now.getHours()).padStart(2, "0");
                const minutes = String(now.getMinutes()).padStart(2, "0");
                const time = `${hours}:${minutes}`;

                const year = now.getFullYear();

                const formatted = `${weekday} ${time} ${year}`;

                document.getElementById("date").textContent = formatted;
                }

                setInterval(atualizarData, 60000);
                atualizarData();
        </script>
        <script>
        const procsDiv = document.getElementById("procs");
const tabPagsDiv = document.getElementById("tab_pags");

// Exemplo de dados: cada processo tem um objeto com frame e valid
const processos = {
    1: { frame: 5, valid: 1 },
    2: { frame: 2, valid: 0 },
    3: { frame: 7, valid: 1 }
};

function criarTabela(procId, dados) {
    const table = document.createElement("table");

    // Cabeçalho fixo: ID | Frame | Valid
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");

    ["id", "frame", "valid"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        trHead.appendChild(th);
    });

    thead.appendChild(trHead);
    table.appendChild(thead);

    // Corpo da tabela
    const tbody = document.createElement("tbody");
    const trBody = document.createElement("tr");

    const tdId = document.createElement("td");
    tdId.textContent = procId;
    trBody.appendChild(tdId);

    const tdFrame = document.createElement("td");
    tdFrame.textContent = dados.frame;
    trBody.appendChild(tdFrame);

    const tdValid = document.createElement("td");
    tdValid.textContent = dados.valid;
    trBody.appendChild(tdValid);

    tbody.appendChild(trBody);
    table.appendChild(tbody);

    return table;
}

// Mostra tabela ao clicar no processo
function mostrarTabela(procId) {
    tabPagsDiv.innerHTML = ""; 
    const tabela = criarTabela(procId, processos[procId]);
    tabPagsDiv.appendChild(tabela);
}

// Adiciona evento de clique
procsDiv.querySelectorAll(".proc").forEach(procEl => {
    procEl.addEventListener("click", () => {
        mostrarTabela(procEl.dataset.id);
    });
});

// Mostrar primeira tabela por padrão
mostrarTabela(1);

        </script>
